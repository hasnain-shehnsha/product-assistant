version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: order_take_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount cache directory for huggingface local models to persist across restarts
      - huggingface_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order_take_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  huggingface_cache:
